<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roots & Ruchi - Voice Ordering</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f7f4ef; color: #2d241e; }
.header { background: #5b2c1f; color: white; padding: 22px 18px; text-align: center; }
.header h1 { margin: 0; font-size: 28px; }
.header p { margin: 7px 0 0; opacity: 0.9; }
.container { max-width: 720px; margin: 25px auto; padding: 0 15px; }
.card { background: white; border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
.status { text-align: center; font-size: 16px; margin-bottom: 18px; font-weight: bold; }
.status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #888; margin-right: 7px; }
.status-listening .status-dot { background: #2e9d50; }
.status-speaking .status-dot { background: #d99000; }
.status-wake .status-dot { background: #2d7dd2; }
.status-error .status-dot { background: #d33; }
.mic-area { text-align: center; padding: 10px 0 20px; }
#micButton { width: 115px; height: 115px; border-radius: 50%; border: none; background: #5b2c1f; color: white; font-size: 46px; cursor: pointer; box-shadow: 0 7px 20px rgba(91,44,31,0.3); }
#micButton.listening { background: #a33b25; animation: pulse 1.3s infinite; }
#micButton.wake { background: #2d7dd2; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
.mic-label { margin-top: 12px; font-size: 16px; color: #666; }
.section-title { font-weight: bold; font-size: 18px; margin-bottom: 10px; }
.heard { min-height: 45px; background: #f2eee9; padding: 14px; border-radius: 10px; line-height: 1.5; }
.assistant { min-height: 45px; background: #fff4df; padding: 14px; border-radius: 10px; line-height: 1.5; }
.cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
.cart-name { font-weight: bold; }
.cart-qty { color: #777; font-size: 14px; }
.total { display: flex; justify-content: space-between; font-size: 21px; font-weight: bold; margin-top: 15px; }
.buttons { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
button.secondary { border: 1px solid #5b2c1f; background: white; color: #5b2c1f; padding: 12px 18px; border-radius: 10px; cursor: pointer; }
.hint { text-align: center; color: #777; font-size: 13px; margin-top: 12px; }
.error { color: #c62828; font-size: 14px; margin-top: 10px; }
.empty { color: #888; padding: 10px 0; }
@media(max-width:600px) { .header h1 { font-size: 23px; } .card { padding: 17px; } }
</style>
</head>
<body>
<div class="header">
  <h1>🌿 Roots & Ruchi</h1>
  <p>Voice Ordering Assistant</p>
</div>

<div class="container">
  <div class="card">
    <div id="status" class="status">
      <span class="status-dot"></span>
      <span id="statusText">Tap Start to begin</span>
    </div>
    <div class="mic-area">
      <button id="micButton" onclick="onMicTap()">🎙️</button>
      <div class="mic-label" id="micLabel">Tap to start</div>
      <div class="hint">After starting, just say "Hey Roots and Ruchi" to order.</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">🗣️ You said</div>
    <div id="heard" class="heard">Waiting...</div>
  </div>

  <div class="card">
    <div class="section-title">🤖 Roots & Ruchi</div>
    <div id="assistant" class="assistant">Tap Start, then say "Hey Roots and Ruchi".</div>
  </div>

  <div class="card">
    <div class="section-title">🛒 Your Order</div>
    <div id="cart"><div class="empty">Your cart is empty.</div></div>
    <div class="total"><span>Total</span><span id="total">₹0</span></div>
  </div>

  <div class="card">
    <div class="buttons">
      <button class="secondary" onclick="startNewOrder()">🔄 New Order</button>
      <button class="secondary" onclick="showCart()">🛒 Refresh Cart</button>
    </div>
    <div id="error" class="error"></div>
  </div>
</div>

<script>
/* =====================================================
   CONFIGURATION
===================================================== */
const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwT0MBiq-vS2yI4QQ1TIuyOb3h6xDPFpXIJPBNAyW7vipLcZFGL2KEoKwLww_GnLUgqnw/exec";

// Wake phrase variants (tolerant to what the browser hears).
const WAKE_PATTERNS = [
  "roots and ruchi", "root and ruchi", "hey roots", "hi roots",
  "hello roots", "roots ruchi", "hey ruchi", "hi ruchi", "rootsandruchi"
];

/* =====================================================
   STATE
===================================================== */
let sessionId = "";
let currentLanguage = "en-IN";
let started = false;             // has the user tapped Start once?

// Two modes for the single recognition object:
//   'WAKE'  -> listening for the wake phrase (idle)
//   'ORDER' -> capturing a real order/utterance
let mode = "WAKE";
let recognition = null;
let supportsSpeech = false;
let finalTranscript = "";
let restartTimer = null;
let silenceTimer = null;         // ends an ORDER turn after a pause
let onboarded = false;           // true once onboarding (lang/name/phone) done

// Audio
let currentAudio = null;
let sharedAudio = null;
let audioUnlocked = false;

/* =====================================================
   UI HELPERS
===================================================== */
function $(id) { return document.getElementById(id); }
function setStatus(text, type) {
  $("statusText").textContent = text;
  const s = $("status"); s.className = "status";
  if (type) s.classList.add("status-" + type);
}
function setAssistant(t) { $("assistant").textContent = t || ""; }
function setHeard(t) { $("heard").textContent = t || ""; }
function showError(t) { $("error").textContent = t || ""; }
function setMic(state) {
  const b = $("micButton");
  b.classList.remove("listening", "wake");
  if (state === "order") { b.classList.add("listening"); b.textContent = "🎙️"; }
  else if (state === "wake") { b.classList.add("wake"); b.textContent = "👂"; }
  else { b.textContent = "🎙️"; }
}

/* =====================================================
   JSONP
===================================================== */
function callBackend(action, params, cb) {
  const name = "rrcb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
  const q = new URLSearchParams();
  q.set("api", "voice"); q.set("action", action); q.set("callback", name);
  params = params || {};
  Object.keys(params).forEach(k => q.set(k, params[k] == null ? "" : params[k]));

  const script = document.createElement("script");
  window[name] = function (res) {
    try { cb(null, res); } catch (e) { cb(e, null); }
    delete window[name]; script.remove();
  };
  script.onerror = function () {
    cb(new Error("Unable to connect to backend."), null);
    delete window[name]; script.remove();
  };
  script.src = APPS_SCRIPT_URL + "?" + q.toString();
  document.body.appendChild(script);
}

/* =====================================================
   AUDIO
===================================================== */
function unlockAudio() {
  if (audioUnlocked) return;
  try {
    if (!sharedAudio) sharedAudio = new Audio();
    sharedAudio.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=";
    const p = sharedAudio.play();
    if (p && p.then) p.then(() => { sharedAudio.pause(); sharedAudio.currentTime = 0; }).catch(() => {});
    audioUnlocked = true;
  } catch (e) {}
}

function playResponseAudio(res, onDone) {
  stopAllAudio();
  if (res && res.audio) {
    try {
      setStatus("Speaking...", "speaking");
      if (!sharedAudio) sharedAudio = new Audio();
      currentAudio = sharedAudio;
      currentAudio.src = "data:audio/wav;base64," + res.audio;
      currentAudio.onended = function () { if (onDone) onDone(); };
      const p = currentAudio.play();
      if (p && p.catch) p.catch(function () {
        browserSpeak(res.speakEnglish || res.speak, onDone);
      });
      return;
    } catch (e) {}
  }
  browserSpeak((res && (res.speak || res.speakEnglish)) || "", onDone);
}

function browserSpeak(text, onDone) {
  if (!text || !("speechSynthesis" in window)) { if (onDone) onDone(); return; }
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-IN";
    u.onstart = function () { setStatus("Speaking...", "speaking"); };
    u.onend = function () { if (onDone) onDone(); };
    window.speechSynthesis.speak(u);
  } catch (e) { if (onDone) onDone(); }
}

function stopAllAudio() {
  if (currentAudio) { try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {} }
  if ("speechSynthesis" in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
}

/* =====================================================
   SESSION
===================================================== */
function startSession(onReady) {
  setStatus("Connecting...", "");
  callBackend("ONBOARD_START", {}, function (err, res) {
    if (err) { showError(err.message); setStatus("Backend connection failed", "error"); return; }
    if (!res || res.ok === false) {
      showError(res && res.error ? res.error : "Unable to start session.");
      setStatus("Backend error", "error"); return;
    }
    sessionId = res.sessionId || "";
    currentLanguage = res.language || "en-IN";
    onboarded = (res.onboardState === "ORDERING");
    applyLang();
    setAssistant(res.speak || "");
    // Speak greeting, then LISTEN for the language answer (onboarding needs a
    // direct answer — the wake word does NOT apply during onboarding).
    playResponseAudio(res, function () {
      showCart();
      if (onReady) onReady();
      else goOrder();   // capture the onboarding answer (language/name/phone)
    });
  });
}

/* =====================================================
   SEND UTTERANCE (order turn)
===================================================== */
function processUtterance(text) {
  text = String(text || "").trim();
  if (!text) { goWake(); return; }

  setHeard(text);
  setStatus("Thinking...", "");
  callBackend("COMMAND", { sessionId: sessionId, text: text }, function (err, res) {
    if (err) { showError(err.message); setStatus("Error", "error"); goWake(); return; }
    if (!res || res.ok === false) {
      showError(res && res.error ? res.error + (res.detail ? " — " + res.detail : "") : "Something went wrong.");
      setStatus("Error", "error"); goWake(); return;
    }
    showError("");
    if (res.sessionId) sessionId = res.sessionId;
    if (res.language && res.language !== currentLanguage) { currentLanguage = res.language; applyLang(); }
    if (res.onboardState) onboarded = (res.onboardState === "ORDERING");
    if (res.speak) setAssistant(res.speak);
    if (res.cart) renderCart(res.cart);

    var placed = (res.intent === "ORDER_PLACED");

    // After the assistant finishes speaking:
    //  - During onboarding OR mid-order: keep listening directly (no wake word).
    //  - After an order is placed: go idle and wait for the wake word again.
    playResponseAudio(res, function () {
      if (placed) { goWake(); }
      else { goOrder(); }
    });
  });
}

/* =====================================================
   CART
===================================================== */
function showCart() {
  if (!sessionId) return;
  callBackend("CART", { sessionId: sessionId }, function (err, res) {
    if (err || !res || res.ok === false) return;
    renderCart(res);
  });
}
function renderCart(cart) {
  const c = $("cart"); c.innerHTML = "";
  if (!cart || !cart.items || cart.items.length === 0) {
    c.innerHTML = '<div class="empty">Your cart is empty.</div>';
    $("total").textContent = "₹0"; return;
  }
  cart.items.forEach(function (it) {
    const row = document.createElement("div"); row.className = "cart-item";
    const left = document.createElement("div");
    left.innerHTML = '<div class="cart-name">' + esc(it.itemName) + '</div>' +
      '<div class="cart-qty">' + it.quantity + " × ₹" + it.unitPrice + "</div>";
    const right = document.createElement("div"); right.textContent = "₹" + it.lineTotal;
    row.appendChild(left); row.appendChild(right); c.appendChild(row);
  });
  $("total").textContent = "₹" + (cart.total || 0);
}
function esc(v) {
  return String(v || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

/* =====================================================
   SPEECH RECOGNITION — wake word + order capture
===================================================== */
function applyLang() {
  if (recognition) recognition.lang = (mode === "ORDER") ? (currentLanguage || "en-IN") : "en-IN";
}

function setupRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    supportsSpeech = false;
    setStatus("Speech recognition not supported", "error");
    $("micLabel").textContent = "Please use Google Chrome";
    return;
  }
  supportsSpeech = true;
  recognition = new SR();
  recognition.interimResults = true;
  recognition.continuous = true;
  recognition.maxAlternatives = 3;

  recognition.onresult = function (event) {
    if (mode === "WAKE") {
      // Scan all alternatives of all results for the wake phrase.
      for (let i = event.resultIndex; i < event.results.length; i++) {
        for (let a = 0; a < event.results[i].length; a++) {
          const heard = (event.results[i][a].transcript || "").toLowerCase();
          if (WAKE_PATTERNS.some(p => heard.indexOf(p) !== -1)) {
            onWakeDetected();
            return;
          }
        }
      }
    } else { // ORDER mode — accumulate final text
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalTranscript += chunk + " ";
        else interim += chunk;
      }
      setHeard((finalTranscript + " " + interim).trim());
      // Any speech resets the silence countdown; when the user pauses, the
      // timer fires, stops recognition, and the turn is submitted.
      armSilenceTimer();
    }
  };

  recognition.onerror = function (e) {
    // no-speech / aborted are normal while idling; just keep the loop alive.
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      showError("Microphone permission denied. Please allow it and reload.");
      setStatus("Microphone blocked", "error");
      return;
    }
    // For other errors, the onend handler will restart the loop.
  };

  recognition.onend = function () {
    if (mode === "ORDER") {
      const full = String(finalTranscript || "").trim();
      finalTranscript = "";
      clearTimeout(silenceTimer);
      if (full) {
        // We have the utterance — process it. Mode stays ORDER; the reply
        // handler decides what happens next (goOrder / goWake).
        processUtterance(full);
        return;
      }
      // Nothing captured yet -> keep listening in ORDER mode (don't drop to
      // wake during onboarding/ordering). Restart the recognizer.
      clearTimeout(restartTimer);
      restartTimer = setTimeout(startRecognitionSafely, 300);
      return;
    }
    // WAKE mode ended (Chrome auto-stops periodically) -> restart to keep
    // continuous listening alive.
    if (started && mode === "WAKE") {
      clearTimeout(restartTimer);
      restartTimer = setTimeout(startRecognitionSafely, 400);
    }
  };
}

// After the user pauses in ORDER mode, stop recognition so onend fires and the
// accumulated transcript is submitted. Reset the timer on every result.
function armSilenceTimer() {
  clearTimeout(silenceTimer);
  silenceTimer = setTimeout(function () {
    if (mode === "ORDER") {
      try { recognition.stop(); } catch (e) {}
    }
  }, 1600); // ~1.6s of silence ends the turn
}

function startRecognitionSafely() {
  if (!recognition || !started) return;
  try { recognition.start(); }
  catch (e) { /* already started; ignore */ }
}

// Switch to wake-listening mode.
function goWake() {
  mode = "WAKE";
  applyLang();
  setMic("wake");
  setStatus('Say "Hey Roots and Ruchi"', "wake");
  $("micLabel").textContent = 'Listening for "Hey Roots and Ruchi"';
  try { recognition.stop(); } catch (e) {}   // onend will restart in WAKE mode
}

// Switch to order-capture mode.
function goOrder() {
  clearTimeout(restartTimer);
  clearTimeout(silenceTimer);
  mode = "ORDER";
  finalTranscript = "";
  applyLang();
  setMic("order");
  setStatus("Listening... (speak now)", "listening");
  $("micLabel").textContent = "Listening… pause when done";
  // Stop any running session, then start fresh in ORDER mode. The onend from
  // the stop will see mode===ORDER with empty transcript and restart, but we
  // pre-empt that with our own start below (guarded by try/catch).
  try { recognition.stop(); } catch (e) {}
  restartTimer = setTimeout(startRecognitionSafely, 350);
}

function onWakeDetected() {
  // Acknowledge and open a listening turn.
  setHeard("(wake word detected)");
  setAssistant("Yes! Please tell me your order.");
  browserSpeak("Yes, please tell me your order.", function () { goOrder(); });
  // If TTS is unavailable, still open the turn.
  setTimeout(function () { if (mode !== "ORDER") goOrder(); }, 1500);
}

/* =====================================================
   MIC BUTTON  (Start / manual talk)
===================================================== */
function onMicTap() {
  if (!supportsSpeech) return;
  unlockAudio();

  if (!started) {
    // First tap: grant mic + start session. Onboarding needs a direct answer,
    // so after the greeting we LISTEN for the language (no onReady -> goOrder()).
    started = true;
    startSession();
    return;
  }

  // Subsequent taps act as a manual "talk now" (skip wake word).
  goOrder();
}

/* =====================================================
   NEW ORDER
===================================================== */
function startNewOrder() {
  unlockAudio();
  sessionId = "";
  currentLanguage = "en-IN";
  setHeard(""); setAssistant("Starting a new order...");
  $("cart").innerHTML = '<div class="empty">Your cart is empty.</div>';
  $("total").textContent = "₹0";
  onboarded = false;
  started = true;
  startSession();   // greeting -> listen for language answer
}

/* =====================================================
   INIT
===================================================== */
window.addEventListener("load", function () {
  setupRecognition();
  setStatus("Tap Start to begin", "");
  $("micLabel").textContent = "Tap to start";
});
</script>
</body>
</html>
