<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roots & Ruchi - Voice Ordering</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f7f4ef; color: #2d241e; }
.header { background: #5b2c1f; color: white; padding: 22px 18px; text-align: center; }
.header h1 { margin: 0; font-size: 28px; }
.header p { margin: 7px 0 0; opacity: 0.9; }
.container { max-width: 720px; margin: 25px auto; padding: 0 15px; }
.card { background: white; border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
.status { text-align: center; font-size: 16px; margin-bottom: 18px; font-weight: bold; }
.status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #888; margin-right: 7px; }
.status-listening .status-dot { background: #2e9d50; }
.status-speaking .status-dot { background: #d99000; }
.status-thinking .status-dot { background: #2d7dd2; }
.status-error .status-dot { background: #d33; }
.mic-area { text-align: center; padding: 10px 0 20px; }
#micButton { width: 115px; height: 115px; border-radius: 50%; border: none; background: #5b2c1f; color: white; font-size: 46px; cursor: pointer; box-shadow: 0 7px 20px rgba(91,44,31,0.3); }
#micButton.listening { background: #a33b25; animation: pulse 1.3s infinite; }
#micButton:disabled { opacity: 0.5; cursor: not-allowed; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
.mic-label { margin-top: 12px; font-size: 16px; color: #666; }
.section-title { font-weight: bold; font-size: 18px; margin-bottom: 10px; }
.heard { min-height: 45px; background: #f2eee9; padding: 14px; border-radius: 10px; line-height: 1.5; }
.assistant { min-height: 45px; background: #fff4df; padding: 14px; border-radius: 10px; line-height: 1.5; }
.cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
.cart-name { font-weight: bold; }
.cart-qty { color: #777; font-size: 14px; }
.total { display: flex; justify-content: space-between; font-size: 21px; font-weight: bold; margin-top: 15px; }
.buttons { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
button.secondary { border: 1px solid #5b2c1f; background: white; color: #5b2c1f; padding: 12px 18px; border-radius: 10px; cursor: pointer; }
.hint { text-align: center; color: #777; font-size: 13px; margin-top: 12px; }
.error { color: #c62828; font-size: 14px; margin-top: 10px; }
.empty { color: #888; padding: 10px 0; }
@media(max-width:600px) { .header h1 { font-size: 23px; } .card { padding: 17px; } }
</style>
</head>
<body>
<div class="header">
  <h1>🌿 Roots &amp; Ruchi</h1>
  <p>Voice Ordering Assistant</p>
</div>

<div class="container">
  <div class="card">
    <div id="status" class="status">
      <span class="status-dot"></span>
      <span id="statusText">Tap the mic to start</span>
    </div>
    <div class="mic-area">
      <button id="micButton" onclick="onMicTap()">🎙️</button>
      <div class="mic-label" id="micLabel">Tap to talk</div>
      <div class="hint">Tap the mic, speak, then tap again (or pause) to send.</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">🗣️ You said</div>
    <div id="heard" class="heard">Waiting...</div>
  </div>

  <div class="card">
    <div class="section-title">🤖 Roots &amp; Ruchi</div>
    <div id="assistant" class="assistant">Tap the mic to begin.</div>
  </div>

  <div class="card">
    <div class="section-title">🛒 Your Order</div>
    <div id="cart"><div class="empty">Your cart is empty.</div></div>
    <div class="total"><span>Total</span><span id="total">₹0</span></div>
  </div>

  <div class="card">
    <div class="buttons">
      <button class="secondary" onclick="startNewOrder()">🔄 New Order</button>
      <button class="secondary" onclick="refreshCart()">🛒 Refresh Cart</button>
    </div>
    <div id="error" class="error"></div>
  </div>
</div>

<script>
/* CONFIG */
var APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwT0MBiq-vS2yI4QQ1TIuyOb3h6xDPFpXIJPBNAyW7vipLcZFGL2KEoKwLww_GnLUgqnw/exec";

/* STATE */
var sessionId = "";
var currentLanguage = "en-IN";
var onboardStep = "ASK_PHONE";   // NEW: first step is now phone number
var started = false;
var listening = false;
var busy = false;
var sharedAudio = null;
var audioUnlocked = false;

// Hands-free: after the first tap the mic restarts automatically after
// every assistant reply until the session ends or an error occurs.
var handsFreeActive = false;

/* ── IDLE-TIMEOUT ENGINE ────────────────────────────────────────────────────
   After the assistant speaks, if the customer says nothing for IDLE_GAP_MS,
   we prompt them ("Are you still there?"). After MAX_IDLE_PROMPTS ignored
   prompts the session is ended and the cart is cleared.
   ─────────────────────────────────────────────────────────────────────────── */
var IDLE_GAP_MS        = 15000;   // 15 s of silence before first prompt
var MAX_IDLE_PROMPTS   = 3;       // 3 unanswered prompts → end session
var idleTimer          = null;
var idlePromptsGiven   = 0;
var IDLE_PROMPTS_EN    = [
  "Are you still there? What would you like to order?",
  "I'm still here — would you like to add something or place your order?",
  "I'll close this session now. Your cart has been cleared. Tap the mic to start a new order."
];

/* Recording state (raw PCM -> WAV, because Sarvam rejects webm) */
var micStream = null;
var audioCtx = null, sourceNode = null, procNode = null, analyser = null;
var pcmChunks = [];
var recSampleRate = 16000;
var silenceTimer = null, maxTimer = null, speechStarted = false, recordStartAt = 0;

/* UI HELPERS */
function $(id) { return document.getElementById(id); }
function setStatus(t, type) { $("statusText").textContent = t; var s = $("status"); s.className = "status"; if (type) s.classList.add("status-" + type); }
function setAssistant(t) { $("assistant").textContent = t || ""; }
function setHeard(t) { $("heard").textContent = t || ""; }
function showError(t) { $("error").textContent = t || ""; }
function setMicListening(on) {
  var b = $("micButton");
  if (on) { b.classList.add("listening"); b.textContent = "🛑"; $("micLabel").textContent = "Listening… (tap to pause)"; }
  else { b.classList.remove("listening"); b.textContent = "🎙️"; $("micLabel").textContent = handsFreeActive ? "Hands-free ON" : "Tap to talk"; }
}
function setMicEnabled(on) { $("micButton").disabled = !on; }

/* JSONP
   Timeout table (ms):
     COMMAND / ONBOARD_TURN  — 58 000  (Apps Script doGet ceiling is ~60s;
                                         a 5-item order now takes ~4-6s after
                                         the batch-addToCart fix, but we keep
                                         the ceiling high for cold-start + Gemini)
     STT_RESULT poll calls   —  8 000  (each individual poll is short)
     Everything else         — 25 000  (TTS, CART, CONFIG, START)
*/
var BACKEND_TIMEOUT = {
  COMMAND:      58000,
  ONBOARD_TURN: 58000,
  STT_RESULT:    8000,
  DEFAULT:      25000
};

function callBackend(action, params, cb) {
  var name = "rrcb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
  var q = new URLSearchParams();
  q.set("api", "voice"); q.set("action", action); q.set("callback", name);
  params = params || {};
  Object.keys(params).forEach(function (k) { q.set(k, params[k] == null ? "" : params[k]); });
  var script = document.createElement("script");
  var done = false;
  var ms = BACKEND_TIMEOUT[action.toUpperCase()] || BACKEND_TIMEOUT.DEFAULT;
  var t = setTimeout(function () {
    if (done) return; done = true;
    cb(new Error("Request timed out after " + Math.round(ms/1000) + "s. Apps Script may be slow — please try again."), null);
    delete window[name]; if (script.parentNode) script.remove();
  }, ms);
  window[name] = function (res) {
    if (done) return; done = true; clearTimeout(t);
    cb(null, res); delete window[name]; if (script.parentNode) script.remove();
  };
  script.onerror = function () {
    if (done) return; done = true; clearTimeout(t);
    cb(new Error("Unable to connect to backend."), null);
    delete window[name]; if (script.parentNode) script.remove();
  };
  script.src = APPS_SCRIPT_URL + "?" + q.toString();
  document.body.appendChild(script);
}

/* AUDIO */
function unlockAudio() {
  if (audioUnlocked) return;
  try {
    if (!sharedAudio) sharedAudio = new Audio();
    sharedAudio.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=";
    var p = sharedAudio.play();
    if (p && p.then) p.then(function () { sharedAudio.pause(); sharedAudio.currentTime = 0; }).catch(function () {});
    audioUnlocked = true;
  } catch (e) {}
}
function stopAudio() {
  if (sharedAudio) { try { sharedAudio.pause(); sharedAudio.currentTime = 0; } catch (e) {} }
  if ("speechSynthesis" in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
}

/* Speak the reply, then hand control back IMMEDIATELY (audio plays in bg). */
function speakThen(res, onDone) {
  stopAudio();
  // Any customer activity resets the idle counter.
  resetIdleTimer();

  var done = false;
  var finish = function () { if (done) return; done = true; if (onDone) onDone(); };

  var text = (res && res.speak) || "";
  var needAudio = res && res.needAudio && res.language && res.language !== "en-IN";

  if (!needAudio) {
    finish();  // re-enable mic / start idle timer now
    if (text && ("speechSynthesis" in window)) {
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = "en-IN";
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }
    return;
  }

  finish();  // re-enable mic now; fetch + play Kannada/Hindi audio in background
  callBackend("TTS", { lang: res.language, text: text }, function (err, a) {
    if (err || !a || !a.audio) return;
    try {
      if (!sharedAudio) sharedAudio = new Audio();
      sharedAudio.onerror = function () {};
      sharedAudio.src = "data:audio/wav;base64," + a.audio;
      var p = sharedAudio.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  });
}

/* RESPONSE HANDLING */
function applyResponse(res) {
  if (res.sessionId) sessionId = res.sessionId;
  if (res.language) currentLanguage = res.language;

  // FIX: onboardState is only present on onboarding responses. Keep the
  // browser's onboardStep in sync but never let it go BACKWARDS. Also
  // detect the ORDERING handoff so the next mic tap goes to food ordering.
  if (res.onboardState) {
    onboardStep = res.onboardState;
  } else if (res.mode === "ORDERING") {
    // COMMAND response from the ordering flow — mark as ORDERING if not already.
    onboardStep = "ORDERING";
  }

  if (res.speak) setAssistant(res.speak);
  if (res.cart) renderCart(res.cart);
}

/* Animated dots in the status bar while waiting for a long backend call.
   Cleared automatically when readyForNextTurn() is called. */
var thinkingTimer = null;
function startThinkingDots() {
  var dots = 0;
  var labels = ["Thinking", "Thinking.", "Thinking..", "Thinking..."];
  thinkingTimer = setInterval(function () {
    dots = (dots + 1) % labels.length;
    setStatus(labels[dots], "thinking");
  }, 600);
}
function stopThinkingDots() {
  if (thinkingTimer) { clearInterval(thinkingTimer); thinkingTimer = null; }
}

function readyForNextTurn(label) {
  stopThinkingDots();
  busy = false;
  setStatus(label || "Listening…", "");
  setMicListening(false);
  setMicEnabled(true);

  // Hands-free: auto-start the mic so the customer never needs to tap again.
  if (handsFreeActive && !listening) {
    setTimeout(function () {
      if (!busy && !listening && handsFreeActive) startListening();
    }, 400);  // brief pause so TTS audio doesn't immediately bleed into the mic
  }
}

/* ── IDLE-TIMEOUT ENGINE ─────────────────────────────────────────────────── */

/** Cancel any pending idle timer (called whenever the customer speaks). */
function resetIdleTimer() {
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  // Don't reset the prompt count here — it accumulates across silences.
}

/**
 * Start the idle countdown after the assistant finishes speaking.
 * Only active when hands-free is on and the session is in ORDERING state.
 */
function scheduleIdleCheck() {
  if (!handsFreeActive || onboardStep !== "ORDERING") return;
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(onIdleTick, IDLE_GAP_MS);
}

function onIdleTick() {
  idleTimer = null;
  if (busy || listening) return; // customer is already talking — ignore

  var prompt = IDLE_PROMPTS_EN[Math.min(idlePromptsGiven, IDLE_PROMPTS_EN.length - 1)];
  idlePromptsGiven++;

  if (idlePromptsGiven >= MAX_IDLE_PROMPTS) {
    // Third strike — end the session and clear the cart.
    handsFreeActive = false;
    setAssistant(prompt);
    setStatus("Session ended", "");
    if ("speechSynthesis" in window) {
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(prompt);
        u.lang = "en-IN";
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }
    // Clear cart on backend.
    if (sessionId) {
      callBackend("COMMAND", { sessionId: sessionId, text: "__force_clear__" }, function () {});
    }
    // Reset UI to a clean "tap to start" state after a short pause.
    setTimeout(function () {
      sessionId = ""; currentLanguage = "en-IN"; onboardStep = "ASK_PHONE";
      idlePromptsGiven = 0;
      started = false;
      $("cart").innerHTML = '<div class="empty">Your cart is empty.</div>';
      $("total").textContent = "₹0";
      setAssistant("Tap the mic to start a new order.");
      setStatus("Tap the mic to start", "");
      setMicEnabled(true);
    }, 4000);
    return;
  }

  // Show prompt and speak it, then schedule the next tick.
  setAssistant(prompt);
  if ("speechSynthesis" in window) {
    try {
      window.speechSynthesis.cancel();
      var pu = new SpeechSynthesisUtterance(prompt);
      pu.lang = "en-IN";
      pu.onend = function () { scheduleIdleCheck(); };
      window.speechSynthesis.speak(pu);
    } catch (e) { scheduleIdleCheck(); }
  } else {
    scheduleIdleCheck();
  }
}

/** Cancel idle timer and reset prompt count — called when customer speaks. */
function customerSpoke() {
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  idlePromptsGiven = 0;
}

/* SESSION */
function startSession() {
  busy = true; setMicEnabled(false);
  setStatus("Connecting...", "thinking");
  callBackend("ONBOARD_START", {}, function (err, res) {
    if (err) { showError(err.message); setStatus("Connection failed", "error"); readyForNextTurn(); return; }
    if (!res || res.ok === false) { showError((res && res.error) || "Unable to start."); setStatus("Error", "error"); readyForNextTurn(); return; }
    showError("");
    applyResponse(res);
    refreshCart();
    // Activate hands-free from this point on — customer only tapped once.
    handsFreeActive = true;
    idlePromptsGiven = 0;
    speakThen(res, function () {
      readyForNextTurn();
      scheduleIdleCheck();
    });
  });
}

/* SEND UTTERANCE */
function sendText(text) {
  text = String(text || "").trim();
  if (!text) { readyForNextTurn("Didn't catch that — listening again…"); return; }
  customerSpoke();   // reset idle timer: customer is actively talking
  setHeard(text);
  busy = true; setMicEnabled(false);
  setStatus("Thinking...", "thinking");
  startThinkingDots();  // animated dots — reassures user the request is in flight
  callBackend("COMMAND", { sessionId: sessionId, text: text }, function (err, res) {
    stopThinkingDots();
    if (err) {
      // Give a friendlier message when it's a timeout (Apps Script was just slow).
      var msg = (err.message || "").indexOf("timed out") !== -1
        ? "Taking longer than expected — please tap the mic and try again."
        : err.message;
      showError(msg); setStatus("Error — tap to retry", "error"); readyForNextTurn(); return;
    }
    if (!res || res.ok === false) {
      showError(res && res.error ? res.error + (res.detail ? " — " + res.detail : "") : "Something went wrong.");
      setStatus("Error", "error"); readyForNextTurn(); return;
    }
    showError("");
    applyResponse(res);
    speakThen(res, function () {
      readyForNextTurn();
      scheduleIdleCheck();  // start idle countdown after assistant finishes
    });
  });
}

/* CART */
function refreshCart() {
  if (!sessionId) return;
  callBackend("CART", { sessionId: sessionId }, function (err, res) {
    if (err || !res || res.ok === false) return;
    renderCart(res);
  });
}
function renderCart(cart) {
  var c = $("cart"); c.innerHTML = "";
  if (!cart || !cart.items || cart.items.length === 0) {
    c.innerHTML = '<div class="empty">Your cart is empty.</div>';
    $("total").textContent = "₹0"; return;
  }
  cart.items.forEach(function (it) {
    var row = document.createElement("div"); row.className = "cart-item";
    var left = document.createElement("div");
    left.innerHTML = '<div class="cart-name">' + esc(it.itemName) + '</div>' +
      '<div class="cart-qty">' + it.quantity + " × ₹" + it.unitPrice + "</div>";
    var right = document.createElement("div"); right.textContent = "₹" + it.lineTotal;
    row.appendChild(left); row.appendChild(right); c.appendChild(row);
  });
  $("total").textContent = "₹" + (cart.total || 0);
}
function esc(v) {
  return String(v || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

/* SPEECH-TO-TEXT (record raw PCM -> WAV -> Sarvam) */
function sttLang() {
  // Phone number and name capture: English STT is most accurate for digits/names.
  // Language selection step: auto-detect so customer can answer in any language.
  // Ordering: use the customer's chosen language.
  if (onboardStep === "ASK_LANGUAGE") return "unknown";
  if (onboardStep === "ASK_PHONE" || onboardStep === "ASK_NAME") return "en-IN";
  return currentLanguage || "en-IN";
}

async function startListening() {
  if (busy || listening) return;
  showError("");
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    showError("Microphone permission denied. Please allow it and try again.");
    return;
  }

  pcmChunks = [];
  speechStarted = false;
  recordStartAt = Date.now();
  listening = true;
  setMicListening(true);
  setStatus("Listening… speak now", "listening");
  setHeard("Listening…");

  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    recSampleRate = audioCtx.sampleRate;
    sourceNode = audioCtx.createMediaStreamSource(micStream);
    procNode = audioCtx.createScriptProcessor(4096, 1, 1);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    var silData = new Uint8Array(analyser.fftSize);

    sourceNode.connect(analyser);
    sourceNode.connect(procNode);
    procNode.connect(audioCtx.destination);

    procNode.onaudioprocess = function (ev) {
      if (!listening) return;
      var input = ev.inputBuffer.getChannelData(0);
      pcmChunks.push(new Float32Array(input));

      analyser.getByteTimeDomainData(silData);
      var sum = 0;
      for (var i = 0; i < silData.length; i++) { var x = (silData[i] - 128) / 128; sum += x * x; }
      var rms = Math.sqrt(sum / silData.length);
      var elapsed = Date.now() - recordStartAt;

      if (rms > 0.012) {
        speechStarted = true;
        clearTimeout(silenceTimer); silenceTimer = null;
      } else if (speechStarted && elapsed > 1500 && !silenceTimer) {
        // Wait ~2s of silence after speech before stopping, so short words and
        // natural pauses aren't cut off prematurely.
        silenceTimer = setTimeout(function () { if (listening) stopListening(); }, 2000);
      }
    };
  } catch (e) {
    showError("Could not start recording: " + (e && e.message ? e.message : e));
    listening = false; setMicListening(false); cleanupMic();
    return;
  }

  maxTimer = setTimeout(function () { if (listening) stopListening(); }, 15000);
}

function stopListening() {
  if (!listening) return;
  listening = false;
  clearTimeout(silenceTimer); clearTimeout(maxTimer);
  setMicListening(false);
  setStatus("Processing…", "thinking");

  var sampleRate = recSampleRate || 16000;
  cleanupMic();

  var total = 0;
  for (var i = 0; i < pcmChunks.length; i++) total += pcmChunks[i].length;
  console.log("Captured PCM samples:", total, "@", sampleRate, "Hz");
  if (total < sampleRate * 0.3) {
    showError("Too little audio captured. Speak a bit longer.");
    readyForNextTurn("Tap the mic and speak again");
    return;
  }

  var merged = new Float32Array(total);
  var off = 0;
  for (var j = 0; j < pcmChunks.length; j++) { merged.set(pcmChunks[j], off); off += pcmChunks[j].length; }
  pcmChunks = [];

  var wavBlob = encodeWav(merged, sampleRate);
  transcribeAndSend(wavBlob, "audio/wav");
}

function cleanupMic() {
  clearTimeout(silenceTimer); clearTimeout(maxTimer);
  try { if (procNode) { procNode.disconnect(); procNode.onaudioprocess = null; } } catch (e) {}
  try { if (sourceNode) sourceNode.disconnect(); } catch (e) {}
  try { if (analyser) analyser.disconnect(); } catch (e) {}
  procNode = null; sourceNode = null; analyser = null;
  if (micStream) { micStream.getTracks().forEach(function (t) { t.stop(); }); micStream = null; }
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
}

function encodeWav(samples, sampleRate) {
  var buffer = new ArrayBuffer(44 + samples.length * 2);
  var view = new DataView(buffer);
  function wr(o, s) { for (var i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); }
  wr(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  wr(8, "WAVE"); wr(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  wr(36, "data");
  view.setUint32(40, samples.length * 2, true);
  var off = 44;
  for (var i = 0; i < samples.length; i++, off += 2) {
    var s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([view], { type: "audio/wav" });
}

function blobToBase64(blob) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onloadend = function () {
      var s = String(r.result || "");
      var c = s.indexOf(",");
      resolve(c >= 0 ? s.substring(c + 1) : s);
    };
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

async function transcribeAndSend(blob, mimeType) {
  busy = true; setMicEnabled(false);
  setStatus("Transcribing…", "thinking");
  setHeard("Transcribing your speech…");
  var base64;
  try { base64 = await blobToBase64(blob); }
  catch (e) { showError("Could not read audio."); readyForNextTurn("Tap the mic to retry"); return; }

  // Two-step transport (works around Apps Script cross-origin POST limits):
  //  1) POST the audio with a token using no-cors (we don't read the response).
  //  2) Poll STT_RESULT via JSONP (GET works cross-origin) to get the transcript.
  var token = "tok_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);

  try {
    console.log("Sending STT POST (no-cors), base64:", base64.length, "lang:", sttLang(), "token:", token);
    // During ORDERING with a non-English language, ask STT to TRANSLATE to
    // English in the same call (saves a separate translate round trip). During
    // onboarding (language/name/phone) we transcribe as-is.
    var sttMode = (onboardStep === "ORDERING" && currentLanguage && currentLanguage !== "en-IN")
      ? "translate" : "transcribe";
    fetch(APPS_SCRIPT_URL + "?api=voice&action=STT&token=" + token, {
      method: "POST",
      mode: "no-cors",                                  // send-only; response not read
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ audio: base64, mimeType: mimeType, lang: sttLang(), mode: sttMode, token: token })
    }).catch(function (err) { console.warn("STT POST error (ignored, will poll):", err); });
  } catch (e) {
    console.warn("STT POST threw (will still poll):", e);
  }

  // Poll for the result via JSONP.
  var attempts = 0;
  var maxAttempts = 40;   // 40 × 0.6s = 24s window — covers slow Sarvam STT on long audio
  function poll() {
    attempts++;
    callBackend("STT_RESULT", { token: token }, function (err, res) {
      if (res && res.ready) {
        var transcript = (res.transcript ? String(res.transcript) : "").trim();
        if (!transcript) {
          showError(res.error ? ("STT: " + String(res.error).substring(0, 140)) : "Empty transcript. Speak longer/clearer.");
          readyForNextTurn("Tap the mic and try again");
          return;
        }
        showError("");
        sendText(transcript);
        return;
      }
      if (attempts >= maxAttempts) {
        showError("Transcription timed out — please tap the mic and try again.");
        readyForNextTurn("Tap the mic to try again");
        return;
      }
      setTimeout(poll, 600);
    });
  }
  setTimeout(poll, 600);   // first poll at 600ms (Sarvam rarely responds faster)
}

/* MIC BUTTON */
function onMicTap() {
  unlockAudio();
  if (!started) {
    started = true;
    startSession();  // first tap → connect and activate hands-free
    return;
  }
  if (busy) return;
  // Manual tap while hands-free is running: toggle pause/resume.
  if (listening) {
    stopListening();
    handsFreeActive = false;  // user paused manually — stop auto-restart
    setStatus("Paused — tap to resume", "");
  } else {
    handsFreeActive = true;   // resume hands-free
    customerSpoke();          // reset idle timer
    startListening();
  }
}

/* NEW ORDER */
function startNewOrder() {
  unlockAudio();
  if (listening) stopListening();
  cleanupMic();
  // Reset all session + hands-free + idle state.
  sessionId = ""; currentLanguage = "en-IN"; onboardStep = "ASK_PHONE";
  handsFreeActive = false;
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  idlePromptsGiven = 0;
  setHeard("Waiting..."); setAssistant("Starting a new order...");
  $("cart").innerHTML = '<div class="empty">Your cart is empty.</div>';
  $("total").textContent = "₹0";
  started = true;
  startSession();
}

/* INIT */
window.addEventListener("load", function () {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !(window.AudioContext || window.webkitAudioContext)) {
    setStatus("Recording not supported — use a modern browser", "error");
    setMicEnabled(false);
    return;
  }
  setStatus("Tap the mic to start", "");
});
</script>
