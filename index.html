<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roots &amp; Ruchi - Voice Ordering</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f7f4ef; color: #2d241e; }
.header { background: #5b2c1f; color: white; padding: 22px 18px; text-align: center; }
.header h1 { margin: 0; font-size: 28px; }
.header p { margin: 7px 0 0; opacity: 0.9; }
.container { max-width: 720px; margin: 25px auto; padding: 0 15px; }
.card { background: white; border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
.status { text-align: center; font-size: 16px; margin-bottom: 18px; font-weight: bold; }
.status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #888; margin-right: 7px; }
.status-listening .status-dot { background: #2e9d50; }
.status-speaking .status-dot  { background: #d99000; }
.status-thinking .status-dot  { background: #2d7dd2; }
.status-error .status-dot     { background: #d33; }
.mic-area { text-align: center; padding: 10px 0 20px; }
#micButton { width: 115px; height: 115px; border-radius: 50%; border: none; background: #5b2c1f; color: white; font-size: 46px; cursor: pointer; box-shadow: 0 7px 20px rgba(91,44,31,0.3); }
#micButton.listening { background: #a33b25; animation: pulse 1.3s infinite; }
#micButton:disabled { opacity: 0.5; cursor: not-allowed; }
@keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.08);} 100%{transform:scale(1);} }
.mic-label { margin-top: 12px; font-size: 16px; color: #666; }
.section-title { font-weight: bold; font-size: 18px; margin-bottom: 10px; }
.heard     { min-height: 45px; background: #f2eee9; padding: 14px; border-radius: 10px; line-height: 1.5; }
.assistant { min-height: 45px; background: #fff4df; padding: 14px; border-radius: 10px; line-height: 1.5; }
.cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
.cart-name { font-weight: bold; }
.cart-qty  { color: #777; font-size: 14px; }
.total { display: flex; justify-content: space-between; font-size: 21px; font-weight: bold; margin-top: 15px; }
.buttons { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
button.secondary { border: 1px solid #5b2c1f; background: white; color: #5b2c1f; padding: 12px 18px; border-radius: 10px; cursor: pointer; }
.hint  { text-align: center; color: #777; font-size: 13px; margin-top: 12px; }
.error { color: #c62828; font-size: 14px; margin-top: 10px; }
.empty { color: #888; padding: 10px 0; }
@media(max-width:600px) { .header h1 { font-size: 23px; } .card { padding: 17px; } }
</style>
</head>
<body>
<div class="header">
  <h1>🌿 Roots &amp; Ruchi</h1>
  <p>Voice Ordering Assistant</p>
</div>

<div class="container">
  <div class="card">
    <div id="status" class="status">
      <span class="status-dot"></span>
      <span id="statusText">Tap the mic to start</span>
    </div>
    <div class="mic-area">
      <button id="micButton" onclick="onMicTap()">🎙️</button>
      <div class="mic-label" id="micLabel">Tap to talk</div>
      <div class="hint">Tap once to start — conversation continues hands-free.</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">🗣️ You said</div>
    <div id="heard" class="heard">Waiting...</div>
  </div>

  <div class="card">
    <div class="section-title">🤖 Roots &amp; Ruchi</div>
    <div id="assistant" class="assistant">Tap the mic to begin.</div>
  </div>

  <div class="card">
    <div class="section-title">🛒 Your Order</div>
    <div id="cart"><div class="empty">Your cart is empty.</div></div>
    <div class="total"><span>Total</span><span id="total">₹0</span></div>
  </div>

  <div class="card">
    <div class="buttons">
      <button class="secondary" onclick="startNewOrder()">🔄 New Order</button>
      <button class="secondary" onclick="refreshCart()">🛒 Refresh Cart</button>
    </div>
    <div id="error" class="error"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ROOTS & RUCHI — VOICE ORDERING (single LLM: Gemini Live)
   • Gemini Live handles STT + TTS + translation + intent for the WHOLE
     conversation (onboarding AND ordering) over one WebSocket.
   • Apps Script + Google Sheets remain the source of truth for
     session, customer, menu, cart and orders.
   • The browser NEVER records WAV or polls. Mic audio streams straight
     to Gemini; Gemini calls tools; tools run on Apps Script via JSONP.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── CONFIG ─────────────────────────────────────────────────────────────── */
var APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwT0MBiq-vS2yI4QQ1TIuyOb3h6xDPFpXIJPBNAyW7vipLcZFGL2KEoKwLww_GnLUgqnw/exec";

var LIVE_WS_URL =
  "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.BidiGenerateContentConstrained";

var LIVE_MODEL = "models/gemini-2.0-flash-live-001";

/* ── SESSION STATE ───────────────────────────────────────────────────────── */
var sessionId       = "";
var started         = false;
var audioUnlocked   = false;
var sessionEnded    = false;

/* ── IDLE-TIMEOUT ENGINE ─────────────────────────────────────────────────── */
var IDLE_GAP_MS      = 15000;   // 15 s of silence
var MAX_IDLE_PROMPTS = 3;
var idleTimer        = null;
var idlePromptsGiven = 0;

/* ── GEMINI LIVE STATE ───────────────────────────────────────────────────── */
var liveWs          = null;
var liveReady       = false;
var liveToken       = null;
var liveMicStream   = null;
var liveInCtx       = null;    // AudioContext for mic input (16 kHz)
var liveOutCtx      = null;    // AudioContext for playback (24 kHz)
var liveSrcNode     = null;
var liveProcNode    = null;
var liveListening   = false;
var liveOutputQueue = [];
var liveOutputBusy  = false;
var liveSpeaking    = false;   // model is currently producing audio

/* ── UI HELPERS ─────────────────────────────────────────────────────────── */
function $(id) { return document.getElementById(id); }
function setStatus(t, type) {
  $("statusText").textContent = t;
  var s = $("status"); s.className = "status";
  if (type) s.classList.add("status-" + type);
}
function setAssistant(t) { $("assistant").textContent = t || ""; }
function setHeard(t)      { $("heard").textContent = t || ""; }
function showError(t)     { $("error").textContent = t || ""; }
function setMicListening(on) {
  var b = $("micButton");
  if (on) { b.classList.add("listening"); b.textContent = "🛑"; $("micLabel").textContent = "Listening… (tap to pause)"; }
  else    { b.classList.remove("listening"); b.textContent = "🎙️"; $("micLabel").textContent = started ? "Hands-free ON" : "Tap to talk"; }
}
function setMicEnabled(on) { $("micButton").disabled = !on; }

/* ── JSONP BACKEND (tools + token + session start) ───────────────────────── */
var BACKEND_TIMEOUT = { COMMAND:58000, TOOL_CALL:58000, GET_TOKEN:15000, DEFAULT:25000 };

function callBackend(action, params, cb) {
  var name = "rrcb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
  var q = new URLSearchParams();
  q.set("api", "voice"); q.set("action", action); q.set("callback", name);
  params = params || {};
  Object.keys(params).forEach(function (k) { q.set(k, params[k] == null ? "" : params[k]); });
  var script = document.createElement("script");
  var done = false;
  var ms = BACKEND_TIMEOUT[action.toUpperCase()] || BACKEND_TIMEOUT.DEFAULT;
  var t = setTimeout(function () {
    if (done) return; done = true;
    cb(new Error("Request timed out after " + Math.round(ms/1000) + "s."), null);
    delete window[name]; if (script.parentNode) script.remove();
  }, ms);
  window[name] = function (res) {
    if (done) return; done = true; clearTimeout(t);
    cb(null, res); delete window[name]; if (script.parentNode) script.remove();
  };
  script.onerror = function () {
    if (done) return; done = true; clearTimeout(t);
    cb(new Error("Unable to connect to backend."), null);
    delete window[name]; if (script.parentNode) script.remove();
  };
  script.src = APPS_SCRIPT_URL + "?" + q.toString();
  document.body.appendChild(script);
}

/* ── AUDIO UNLOCK ────────────────────────────────────────────────────────── */
function unlockAudio() {
  if (audioUnlocked) return;
  try {
    var a = new Audio();
    a.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=";
    var p = a.play();
    if (p && p.then) p.then(function(){ a.pause(); }).catch(function(){});
    audioUnlocked = true;
  } catch (e) {}
}

/* ── CART ────────────────────────────────────────────────────────────────── */
function refreshCart() {
  if (!sessionId) return;
  callBackend("CART", { sessionId: sessionId }, function (err, res) {
    if (err || !res || res.ok === false) return;
    renderCart(res);
  });
}
function renderCart(cart) {
  var c = $("cart"); c.innerHTML = "";
  if (!cart || !cart.items || !cart.items.length) {
    c.innerHTML = '<div class="empty">Your cart is empty.</div>';
    $("total").textContent = "₹0"; return;
  }
  cart.items.forEach(function (it) {
    var row  = document.createElement("div"); row.className = "cart-item";
    var left = document.createElement("div");
    left.innerHTML = '<div class="cart-name">' + esc(it.itemName) + '</div>' +
      '<div class="cart-qty">' + it.quantity + " × ₹" + it.unitPrice + "</div>";
    var right = document.createElement("div"); right.textContent = "₹" + it.lineTotal;
    row.appendChild(left); row.appendChild(right); c.appendChild(row);
  });
  $("total").textContent = "₹" + (cart.total || 0);
}
function esc(v) {
  return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

/* ── IDLE-TIMEOUT ───────────────────────────────────────────────────────── */
function resetIdleTimer() { if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; } }

function scheduleIdleCheck() {
  if (!started || sessionEnded) return;
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(onIdleTick, IDLE_GAP_MS);
}

function onIdleTick() {
  idleTimer = null;
  if (liveSpeaking) { scheduleIdleCheck(); return; }
  idlePromptsGiven++;
  if (idlePromptsGiven >= MAX_IDLE_PROMPTS) {
    endSessionIdle();
    return;
  }
  // Nudge the customer through Gemini (send a text turn so Gemini asks again).
  liveSendText("The customer has been silent. Briefly ask if they are still there and want to continue.");
  scheduleIdleCheck();
}

function customerSpoke() {
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  idlePromptsGiven = 0;
}

function endSessionIdle() {
  sessionEnded = true;
  resetIdleTimer();
  if (sessionId) callBackend("COMMAND", { sessionId: sessionId, text: "__force_clear__" }, function(){});
  liveClose();
  setHeard("Waiting...");
  setAssistant("Session closed due to inactivity. Your cart was cleared. Tap the mic to start again.");
  setStatus("Session ended — tap to start", "");
  setMicListening(false);
  setMicEnabled(true);
  started = false;
  sessionId = "";
  idlePromptsGiven = 0;
}

/* ══════════════════════════════════════════════════════════════════════════
   SESSION START  — create Apps Script session, then open Gemini Live
   ══════════════════════════════════════════════════════════════════════════ */
function startSession() {
  sessionEnded = false;
  setStatus("Connecting…", "thinking");
  setMicEnabled(false);
  // Create the SESSIONS row (also sets Onboard_State = ASK_PHONE server-side).
  callBackend("ONBOARD_START", {}, function (err, res) {
    if (err || !res || res.ok === false) {
      showError((err && err.message) || (res && res.error) || "Unable to start.");
      setStatus("Error — tap to retry", "error");
      setMicEnabled(true); started = false;
      return;
    }
    sessionId = res.sessionId || "";
    refreshCart();
    openLiveSession();
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   GEMINI LIVE
   ══════════════════════════════════════════════════════════════════════════ */

var LIVE_SYSTEM_PROMPT = [
  "You are the friendly AI voice waiter for Roots & Ruchi restaurant.",
  "You handle the WHOLE conversation by voice in the customer's language",
  "(English, Kannada, Hindi, Tamil or Telugu). Detect their language from",
  "how they speak and reply in that same language. Keep replies short and natural.",
  "",
  "STEP 1 — ONBOARDING (do this first, before taking any order):",
  "  a) Greet and ask for the customer's 10-digit mobile number.",
  "  b) When they say a number, call handle_customer_message with their exact words.",
  "     The tool tells you what to ask next (it may greet a returning customer by",
  "     name, or ask for language then name for a new customer).",
  "  c) Always speak the 'speak' text returned by the tool, in the customer's language.",
  "",
  "STEP 2 — ORDERING (only after the tool says onboarding is done):",
  "  • The MENU Google Sheet is the ONLY source of truth for items and prices.",
  "  • NEVER invent an item or price.",
  "  • When the customer mentions food, call search_menu first.",
  "  • Add items with add_to_cart using the exact Item_ID from search_menu.",
  "  • After every cart change call view_cart and tell the customer the running total.",
  "  • If several items match, ask the customer to choose.",
  "  • NEVER place the order until the customer clearly confirms.",
  "  • When they confirm ('yes', 'place order', 'that's all, order it'), call create_order.",
  "",
  "Be concise. This is a spoken conversation, not a chat window.",
  "SESSION_ID: {{SESSION_ID}}"
].join("\n");

function liveToolDeclarations() {
  return [{
    functionDeclarations: [
      {
        name: "handle_customer_message",
        description: "Onboarding router. Send the customer's spoken words (mobile number, chosen language, or name). Returns the next prompt to speak and whether onboarding is complete.",
        parameters: {
          type: "OBJECT",
          properties: { text: { type: "STRING", description: "The customer's exact spoken words." } },
          required: ["text"]
        }
      },
      {
        name: "search_menu",
        description: "Search the restaurant menu. Call before adding any item.",
        parameters: {
          type: "OBJECT",
          properties: {
            query:      { type: "STRING", description: "Food name or keyword." },
            max_price:  { type: "NUMBER", description: "Max price filter (optional)." },
            category:   { type: "STRING", description: "Category filter (optional)." },
            veg_nonveg: { type: "STRING", description: "Veg or Non-Veg (optional)." }
          }
        }
      },
      {
        name: "add_to_cart",
        description: "Add a menu item to the cart. Use exact Item_ID from search_menu.",
        parameters: {
          type: "OBJECT",
          properties: {
            item_id:  { type: "STRING" },
            quantity: { type: "NUMBER" }
          },
          required: ["item_id", "quantity"]
        }
      },
      {
        name: "set_cart_quantity",
        description: "Set the quantity of an item already in the cart (0 removes it).",
        parameters: {
          type: "OBJECT",
          properties: { item_id: { type: "STRING" }, quantity: { type: "NUMBER" } },
          required: ["item_id", "quantity"]
        }
      },
      {
        name: "remove_from_cart",
        description: "Remove an item from the cart completely.",
        parameters: {
          type: "OBJECT",
          properties: { item_id: { type: "STRING" } },
          required: ["item_id"]
        }
      },
      {
        name: "view_cart",
        description: "Get the current cart contents and total.",
        parameters: { type: "OBJECT", properties: {} }
      },
      {
        name: "create_order",
        description: "Place the final order. Only after the customer explicitly confirms.",
        parameters: { type: "OBJECT", properties: {} }
      }
    ]
  }];
}

function openLiveSession() {
  setStatus("Connecting to voice…", "thinking");
  callBackend("GET_TOKEN", { sessionId: sessionId }, function (err, res) {
    if (err || !res || !res.ok || !res.token) {
      showError("Voice token error: " + (err ? err.message : (res && res.error) || "unknown"));
      setStatus("Error — tap to retry", "error");
      setMicEnabled(true); started = false;
      return;
    }
    liveToken = res.token;
    liveConnect();
  });
}

function liveConnect() {
  if (liveWs) { try { liveWs.close(); } catch(e){} liveWs = null; }
  liveReady = false; liveListening = false;

  liveWs = new WebSocket(LIVE_WS_URL + "?key=" + encodeURIComponent(liveToken));

  liveWs.onopen = function () {
    var setup = {
      setup: {
        model: LIVE_MODEL,
        systemInstruction: { parts: [{ text: LIVE_SYSTEM_PROMPT.replace("{{SESSION_ID}}", sessionId) }] },
        tools: liveToolDeclarations(),
        generationConfig: {
          responseModalities: ["AUDIO"],
          speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Charon" } } }
        },
        inputAudioTranscription: {},
        outputAudioTranscription: {}
      }
    };
    liveWs.send(JSON.stringify(setup));
    setStatus("Setting up…", "thinking");
  };

  liveWs.onmessage = function (ev) {
    var data;
    try { data = JSON.parse(ev.data); } catch(e) { return; }
    liveHandleMessage(data);
  };

  liveWs.onerror = function () {
    showError("Voice connection error — tap to retry.");
    setStatus("Error", "error");
    setMicEnabled(true);
    liveListening = false; liveReady = false;
  };

  liveWs.onclose = function () {
    liveListening = false; liveReady = false;
    liveStopMic();
  };
}

function liveHandleMessage(data) {

  // Setup finished → greet + open the mic
  if (data.setupComplete) {
    liveReady = true;
    setStatus("Listening…", "listening");
    // Ask Gemini to greet and request the phone number.
    liveSendText("Greet the customer for Roots and Ruchi and ask for their 10-digit mobile number.");
    liveStartMic();
    scheduleIdleCheck();
    return;
  }

  // Tool call(s)
  if (data.toolCall && data.toolCall.functionCalls) {
    data.toolCall.functionCalls.forEach(function (fc) { liveRunTool(fc); });
    return;
  }

  // Server content (audio + transcripts)
  if (data.serverContent) {
    var sc = data.serverContent;

    if (sc.inputTranscription && sc.inputTranscription.text) {
      setHeard(sc.inputTranscription.text);
      customerSpoke();
    }
    if (sc.outputTranscription && sc.outputTranscription.text) {
      setAssistant(sc.outputTranscription.text);
    }
    if (sc.modelTurn && sc.modelTurn.parts) {
      sc.modelTurn.parts.forEach(function (part) {
        if (part.inlineData && part.inlineData.mimeType &&
            part.inlineData.mimeType.indexOf("audio/pcm") === 0) {
          liveEnqueueAudio(part.inlineData.data);
        }
        if (part.text) setAssistant(part.text);
      });
    }
    if (sc.turnComplete) {
      setStatus("Listening…", "listening");
      resetIdleTimer();
      scheduleIdleCheck();
    }
  }
}

/* Run a tool Gemini requested → Apps Script → send result back to Gemini */
function liveRunTool(fc) {
  setStatus("Working…", "thinking");

  // Onboarding router uses COMMAND; everything else uses TOOL_CALL.
  if (fc.name === "handle_customer_message") {
    var text = (fc.args && fc.args.text) ? String(fc.args.text) : "";
    callBackend("COMMAND", { sessionId: sessionId, text: text }, function (err, res) {
      var result = (err || !res || res.ok === false)
        ? { error: String(err ? err.message : (res && res.error)) }
        : res;
      if (res && res.cart) renderCart(res.cart);
      liveSendToolResponse(fc, { result: result });
      setStatus("Listening…", "listening");
    });
    return;
  }

  // Cart / menu / order tools
  callBackend("TOOL_CALL", {
    sessionId: sessionId,
    toolName:  fc.name,
    toolArgs:  JSON.stringify(fc.args || {})
  }, function (err, res) {
    var toolResult = (err || !res || !res.ok) ? { error: String(err ? err.message : res && res.error) } : (res.result || {});
    var mutations = ["add_to_cart","set_cart_quantity","remove_from_cart","create_order","view_cart"];
    if (mutations.indexOf(fc.name) !== -1 && toolResult && !toolResult.error) {
      refreshCart();
      if (fc.name === "create_order" && toolResult.orderId) liveHandleOrderPlaced(toolResult);
    }
    liveSendToolResponse(fc, { result: toolResult });
    setStatus("Listening…", "listening");
  });
}

function liveSendToolResponse(fc, responseObj) {
  if (!liveWs || liveWs.readyState !== WebSocket.OPEN) return;
  liveWs.send(JSON.stringify({
    toolResponse: { functionResponses: [{ id: fc.id, name: fc.name, response: responseObj }] }
  }));
}

/* Send a text turn to Gemini (used for greeting + idle nudges) */
function liveSendText(text) {
  if (!liveWs || liveWs.readyState !== WebSocket.OPEN) return;
  liveWs.send(JSON.stringify({
    clientContent: {
      turns: [{ role: "user", parts: [{ text: text }] }],
      turnComplete: true
    }
  }));
}

/* ── ORDER PLACED ───────────────────────────────────────────────────────── */
function liveHandleOrderPlaced(orderResult) {
  resetIdleTimer();
  // Let Gemini finish speaking the confirmation, then close the session.
  setTimeout(function () {
    sessionEnded = true;
    liveClose();
    setStatus("Order placed ✓ — tap the mic for a new order", "");
    setMicListening(false);
    setMicEnabled(true);
    started = false;
    sessionId = "";
  }, 5000);
}

/* ── AUDIO PLAYBACK (24 kHz PCM from Gemini) ─────────────────────────────── */
function liveEnqueueAudio(b64) {
  liveOutputQueue.push(b64);
  if (!liveOutputBusy) livePlayNext();
}
function livePlayNext() {
  if (!liveOutputQueue.length) { liveOutputBusy = false; liveSpeaking = false; return; }
  liveOutputBusy = true; liveSpeaking = true;
  var b64 = liveOutputQueue.shift();
  try {
    var raw = atob(b64);
    var buf = new ArrayBuffer(raw.length);
    var u8  = new Uint8Array(buf);
    for (var i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
    var pcm = new Int16Array(buf);
    var flo = new Float32Array(pcm.length);
    for (var j = 0; j < pcm.length; j++) flo[j] = pcm[j] / 32768;

    if (!liveOutCtx) liveOutCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    if (liveOutCtx.state === "suspended") liveOutCtx.resume();

    var abuf = liveOutCtx.createBuffer(1, flo.length, 24000);
    abuf.copyToChannel(flo, 0);
    var src = liveOutCtx.createBufferSource();
    src.buffer = abuf;
    src.connect(liveOutCtx.destination);
    src.onended = function () { livePlayNext(); };
    src.start();
    setStatus("Speaking…", "speaking");
  } catch (e) {
    liveOutputBusy = false; liveSpeaking = false;
    livePlayNext();
  }
}

/* ── MIC STREAMING (16 kHz PCM → Gemini) ─────────────────────────────────── */
function liveStartMic() {
  if (liveListening || !liveReady) return;
  navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1 } })
    .then(function (stream) {
      liveMicStream = stream;
      liveListening = true;
      setMicListening(true);
      setMicEnabled(true);

      if (!liveInCtx) liveInCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      if (liveInCtx.state === "suspended") liveInCtx.resume();

      liveSrcNode  = liveInCtx.createMediaStreamSource(stream);
      liveProcNode = liveInCtx.createScriptProcessor(4096, 1, 1);

      liveProcNode.onaudioprocess = function (ev) {
        if (!liveListening || !liveWs || liveWs.readyState !== WebSocket.OPEN) return;
        // Don't stream mic while the model is speaking (avoid echo).
        if (liveSpeaking) return;

        var floats = ev.inputBuffer.getChannelData(0);
        // Resample if the context isn't exactly 16 kHz.
        var inRate = liveInCtx.sampleRate;
        var data16;
        if (inRate === 16000) {
          data16 = floats;
        } else {
          var ratio = inRate / 16000;
          var outLen = Math.floor(floats.length / ratio);
          data16 = new Float32Array(outLen);
          for (var k = 0; k < outLen; k++) data16[k] = floats[Math.floor(k * ratio)];
        }
        var int16 = new Int16Array(data16.length);
        for (var i = 0; i < data16.length; i++) {
          var s = Math.max(-1, Math.min(1, data16[i]));
          int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        var bytes = new Uint8Array(int16.buffer);
        var bin = "";
        for (var b = 0; b < bytes.length; b++) bin += String.fromCharCode(bytes[b]);
        liveWs.send(JSON.stringify({
          realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: btoa(bin) }] }
        }));
      };

      liveSrcNode.connect(liveProcNode);
      liveProcNode.connect(liveInCtx.destination);
    })
    .catch(function () {
      showError("Microphone permission denied. Please allow it and try again.");
      liveListening = false;
    });
}

function liveStopMic() {
  liveListening = false;
  setMicListening(false);
  try { if (liveProcNode) { liveProcNode.disconnect(); liveProcNode.onaudioprocess = null; } } catch(e){}
  try { if (liveSrcNode)  liveSrcNode.disconnect(); } catch(e){}
  liveProcNode = null; liveSrcNode = null;
  if (liveMicStream) { liveMicStream.getTracks().forEach(function(t){ t.stop(); }); liveMicStream = null; }
}

function liveClose() {
  liveStopMic();
  if (liveWs) { try { liveWs.close(); } catch(e){} liveWs = null; }
  liveReady = false; liveToken = null;
  liveOutputQueue = []; liveOutputBusy = false; liveSpeaking = false;
}

/* ══════════════════════════════════════════════════════════════════════════
   MIC BUTTON + NEW ORDER
   ══════════════════════════════════════════════════════════════════════════ */
function onMicTap() {
  unlockAudio();
  if (!started) { started = true; startSession(); return; }
  // Toggle pause / resume the live mic
  if (liveListening) {
    liveStopMic();
    setStatus("Paused — tap to resume", "");
  } else if (liveReady) {
    customerSpoke();
    liveStartMic();
    scheduleIdleCheck();
  } else {
    // Connection dropped — reconnect
    openLiveSession();
  }
}

function startNewOrder() {
  unlockAudio();
  liveClose();
  resetIdleTimer();
  sessionId = ""; started = false; sessionEnded = false; idlePromptsGiven = 0;
  setHeard("Waiting..."); setAssistant("Starting a new order...");
  $("cart").innerHTML = '<div class="empty">Your cart is empty.</div>';
  $("total").textContent = "₹0";
  started = true;
  startSession();
}

/* ── INIT ────────────────────────────────────────────────────────────────── */
window.addEventListener("load", function () {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia ||
      !(window.AudioContext || window.webkitAudioContext)) {
    setStatus("Voice not supported — use Chrome or Edge", "error");
    setMicEnabled(false); return;
  }
  if (typeof WebSocket === "undefined") {
    setStatus("WebSocket not supported — use Chrome or Edge", "error");
    setMicEnabled(false); return;
  }
  setStatus("Tap the mic to start", "");
});
</script>
