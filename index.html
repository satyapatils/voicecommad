<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roots & Ruchi - Voice Ordering</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f7f4ef; color: #2d241e; }
.header { background: #5b2c1f; color: white; padding: 22px 18px; text-align: center; }
.header h1 { margin: 0; font-size: 28px; }
.header p { margin: 7px 0 0; opacity: 0.9; }
.container { max-width: 720px; margin: 25px auto; padding: 0 15px; }
.card { background: white; border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
.status { text-align: center; font-size: 16px; margin-bottom: 18px; font-weight: bold; }
.status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #888; margin-right: 7px; }
.status-listening .status-dot { background: #2e9d50; }
.status-speaking .status-dot { background: #d99000; }
.status-thinking .status-dot { background: #2d7dd2; }
.status-error .status-dot { background: #d33; }
.mic-area { text-align: center; padding: 10px 0 20px; }
#micButton { width: 115px; height: 115px; border-radius: 50%; border: none; background: #5b2c1f; color: white; font-size: 46px; cursor: pointer; box-shadow: 0 7px 20px rgba(91,44,31,0.3); }
#micButton.listening { background: #a33b25; animation: pulse 1.3s infinite; }
#micButton:disabled { opacity: 0.5; cursor: not-allowed; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
.mic-label { margin-top: 12px; font-size: 16px; color: #666; }
.section-title { font-weight: bold; font-size: 18px; margin-bottom: 10px; }
.heard { min-height: 45px; background: #f2eee9; padding: 14px; border-radius: 10px; line-height: 1.5; }
.assistant { min-height: 45px; background: #fff4df; padding: 14px; border-radius: 10px; line-height: 1.5; }
.cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
.cart-name { font-weight: bold; }
.cart-qty { color: #777; font-size: 14px; }
.total { display: flex; justify-content: space-between; font-size: 21px; font-weight: bold; margin-top: 15px; }
.buttons { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
button.secondary { border: 1px solid #5b2c1f; background: white; color: #5b2c1f; padding: 12px 18px; border-radius: 10px; cursor: pointer; }
.hint { text-align: center; color: #777; font-size: 13px; margin-top: 12px; }
.error { color: #c62828; font-size: 14px; margin-top: 10px; }
.empty { color: #888; padding: 10px 0; }
@media(max-width:600px) { .header h1 { font-size: 23px; } .card { padding: 17px; } }
</style>
</head>
<body>
<div class="header">
  <h1>🌿 Roots & Ruchi</h1>
  <p>Voice Ordering Assistant</p>
</div>

<div class="container">
  <div class="card">
    <div id="status" class="status">
      <span class="status-dot"></span>
      <span id="statusText">Tap the mic to start</span>
    </div>
    <div class="mic-area">
      <button id="micButton" onclick="onMicTap()">🎙️</button>
      <div class="mic-label" id="micLabel">Tap to talk</div>
      <div class="hint">Tap the mic, speak, then tap again (or pause) to send.</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">🗣️ You said</div>
    <div id="heard" class="heard">Waiting...</div>
  </div>

  <div class="card">
    <div class="section-title">🤖 Roots & Ruchi</div>
    <div id="assistant" class="assistant">Tap the mic to begin.</div>
  </div>

  <div class="card">
    <div class="section-title">🛒 Your Order</div>
    <div id="cart"><div class="empty">Your cart is empty.</div></div>
    <div class="total"><span>Total</span><span id="total">₹0</span></div>
  </div>

  <div class="card">
    <div class="buttons">
      <button class="secondary" onclick="startNewOrder()">🔄 New Order</button>
      <button class="secondary" onclick="refreshCart()">🛒 Refresh Cart</button>
    </div>
    <div id="error" class="error"></div>
  </div>
</div>

<script>
/* =====================================================
   CONFIG
===================================================== */
const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwT0MBiq-vS2yI4QQ1TIuyOb3h6xDPFpXIJPBNAyW7vipLcZFGL2KEoKwLww_GnLUgqnw/exec";

/* =====================================================
   STATE
===================================================== */
let sessionId = "";
let currentLanguage = "en-IN";
let onboardStep = "ASK_LANGUAGE";
let started = false;
let listening = false;
let busy = false;                // waiting on backend / speaking
let sharedAudio = null;
let audioUnlocked = false;

// Sarvam STT recording state — we record raw PCM and encode WAV ourselves,
// because Sarvam rejects webm/opus (MediaRecorder's format).
let micStream = null;
let audioCtx = null, sourceNode = null, procNode = null, analyser = null;
let pcmChunks = [];          // Float32 buffers of raw audio
let recSampleRate = 16000;
let silenceTimer = null, maxTimer = null, speechStarted = false, recordStartAt = 0;

/* =====================================================
   UI HELPERS
===================================================== */
function $(id) { return document.getElementById(id); }
function setStatus(t, type) { $("statusText").textContent = t; const s = $("status"); s.className = "status"; if (type) s.classList.add("status-" + type); }
function setAssistant(t) { $("assistant").textContent = t || ""; }
function setHeard(t) { $("heard").textContent = t || ""; }
function showError(t) { $("error").textContent = t || ""; }
function setMicListening(on) {
  const b = $("micButton");
  if (on) { b.classList.add("listening"); b.textContent = "🛑"; $("micLabel").textContent = "Listening… tap to send"; }
  else { b.classList.remove("listening"); b.textContent = "🎙️"; $("micLabel").textContent = "Tap to talk"; }
}
function setMicEnabled(on) { $("micButton").disabled = !on; }

/* =====================================================
   JSONP
===================================================== */
function callBackend(action, params, cb) {
  const name = "rrcb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
  const q = new URLSearchParams();
  q.set("api", "voice"); q.set("action", action); q.set("callback", name);
  params = params || {};
  Object.keys(params).forEach(k => q.set(k, params[k] == null ? "" : params[k]));
  const script = document.createElement("script");
  let done = false;
  const t = setTimeout(function () {
    if (done) return; done = true;
    cb(new Error("Request timed out."), null);
    delete window[name]; if (script.parentNode) script.remove();
  }, 20000);
  window[name] = function (res) {
    if (done) return; done = true; clearTimeout(t);
    cb(null, res); delete window[name]; if (script.parentNode) script.remove();
  };
  script.onerror = function () {
    if (done) return; done = true; clearTimeout(t);
    cb(new Error("Unable to connect to backend."), null);
    delete window[name]; if (script.parentNode) script.remove();
  };
  script.src = APPS_SCRIPT_URL + "?" + q.toString();
  document.body.appendChild(script);
}

/* =====================================================
   AUDIO
===================================================== */
function unlockAudio() {
  if (audioUnlocked) return;
  try {
    if (!sharedAudio) sharedAudio = new Audio();
    sharedAudio.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=";
    const p = sharedAudio.play();
    if (p && p.then) p.then(() => { sharedAudio.pause(); sharedAudio.currentTime = 0; }).catch(() => {});
    audioUnlocked = true;
  } catch (e) {}
}
function stopAudio() {
  if (sharedAudio) { try { sharedAudio.pause(); sharedAudio.currentTime = 0; } catch (e) {} }
  if ("speechSynthesis" in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
}

// Speak the reply, then call onDone (exactly once, always).
function speakThen(res, onDone) {
  stopAudio();
  setStatus("Speaking...", "speaking");
  let done = false;
  const finish = function () { if (done) return; done = true; onDone && onDone(); };

  const text = (res && res.speak) || "";
  const needAudio = res && res.needAudio && res.language && res.language !== "en-IN";

  if (!needAudio) {
    // English or nothing to speak -> browser voice with a guaranteed fallback
    // (Chrome's onend is unreliable, so we also time out based on length).
    if (!text || !("speechSynthesis" in window)) { setTimeout(finish, 300); return; }
    const estMs = Math.min(9000, 1200 + text.length * 70);
    setTimeout(finish, estMs);
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-IN";
      u.onend = finish; u.onerror = finish;
      window.speechSynthesis.speak(u);
    } catch (e) { finish(); }
    return;
  }

  // Non-English -> fetch Sarvam audio, play it, then finish. Hard safety timer.
  const guard = setTimeout(finish, 9000);
  callBackend("TTS", { lang: res.language, text: text }, function (err, a) {
    if (err || !a || !a.audio) { clearTimeout(guard); finish(); return; }
    try {
      if (!sharedAudio) sharedAudio = new Audio();
      sharedAudio.onended = function () { clearTimeout(guard); finish(); };
      sharedAudio.onerror = function () { clearTimeout(guard); finish(); };
      sharedAudio.src = "data:audio/wav;base64," + a.audio;
      const est = Math.min(15000, Math.max(2500, Math.round(a.audio.length / 16) + 1500));
      setTimeout(function () { clearTimeout(guard); finish(); }, est);
      const p = sharedAudio.play();
      if (p && p.catch) p.catch(function () { clearTimeout(guard); finish(); });
    } catch (e) { clearTimeout(guard); finish(); }
  });
}

/* =====================================================
   RESPONSE HANDLING
===================================================== */
function applyResponse(res) {
  if (res.sessionId) sessionId = res.sessionId;
  if (res.language) currentLanguage = res.language;
  if (res.onboardState) onboardStep = res.onboardState;
  if (res.speak) setAssistant(res.speak);
  if (res.cart) renderCart(res.cart);
}

function readyForNextTurn(label) {
  busy = false;
  setStatus(label || "Your turn — tap the mic", "");
  setMicListening(false);
  setMicEnabled(true);
}

/* =====================================================
   SESSION
===================================================== */
function startSession() {
  busy = true; setMicEnabled(false);
  setStatus("Connecting...", "thinking");
  callBackend("ONBOARD_START", {}, function (err, res) {
    if (err) { showError(err.message); setStatus("Connection failed", "error"); readyForNextTurn(); return; }
    if (!res || res.ok === false) { showError((res && res.error) || "Unable to start."); setStatus("Error", "error"); readyForNextTurn(); return; }
    showError("");
    applyResponse(res);
    refreshCart();
    speakThen(res, function () { readyForNextTurn("Your turn — tap the mic to answer"); });
  });
}

/* =====================================================
   SEND UTTERANCE
===================================================== */
function sendText(text) {
  text = String(text || "").trim();
  if (!text) { readyForNextTurn("Didn't catch that — tap the mic and try again"); return; }
  setHeard(text);
  busy = true; setMicEnabled(false);
  setStatus("Thinking...", "thinking");
  callBackend("COMMAND", { sessionId: sessionId, text: text }, function (err, res) {
    if (err) { showError(err.message); setStatus("Error", "error"); readyForNextTurn(); return; }
    if (!res || res.ok === false) {
      showError(res && res.error ? res.error + (res.detail ? " — " + res.detail : "") : "Something went wrong.");
      setStatus("Error", "error"); readyForNextTurn(); return;
    }
    showError("");
    applyResponse(res);
    speakThen(res, function () { readyForNextTurn(); });
  });
}

/* =====================================================
   CART
===================================================== */
function refreshCart() {
  if (!sessionId) return;
  callBackend("CART", { sessionId: sessionId }, function (err, res) {
    if (err || !res || res.ok === false) return;
    renderCart(res);
  });
}
function renderCart(cart) {
  const c = $("cart"); c.innerHTML = "";
  if (!cart || !cart.items || cart.items.length === 0) {
    c.innerHTML = '<div class="empty">Your cart is empty.</div>';
    $("total").textContent = "₹0"; return;
  }
  cart.items.forEach(function (it) {
    const row = document.createElement("div"); row.className = "cart-item";
    const left = document.createElement("div");
    left.innerHTML = '<div class="cart-name">' + esc(it.itemName) + '</div>' +
      '<div class="cart-qty">' + it.quantity + " × ₹" + it.unitPrice + "</div>";
    const right = document.createElement("div"); right.textContent = "₹" + it.lineTotal;
    row.appendChild(left); row.appendChild(right); c.appendChild(row);
  });
  $("total").textContent = "₹" + (cart.total || 0);
}
function esc(v) {
  return String(v || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

/* =====================================================
   SARVAM SPEECH-TO-TEXT (record -> send audio -> transcript)
   Far more accurate for Kannada/Hindi/Tamil/Telugu than browser STT.
===================================================== */
function sttLang() {
  // Names, phone numbers and the initial language choice transcribe best in
  // English/auto; item ordering uses the chosen language.
  if (onboardStep === "ASK_NAME" || onboardStep === "ASK_PHONE" || onboardStep === "ASK_LANGUAGE") {
    return "en-IN";
  }
  return currentLanguage || "en-IN";
}

async function startListening() {
  if (busy || listening) return;
  showError("");
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    showError("Microphone permission denied. Please allow it and try again.");
    return;
  }

  pcmChunks = [];
  speechStarted = false;
  recordStartAt = Date.now();
  listening = true;
  setMicListening(true);
  setStatus("Listening… speak now", "listening");
  setHeard("Listening…");

  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    recSampleRate = audioCtx.sampleRate;
    sourceNode = audioCtx.createMediaStreamSource(micStream);
    procNode = audioCtx.createScriptProcessor(4096, 1, 1);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    const silData = new Uint8Array(analyser.fftSize);

    sourceNode.connect(analyser);
    sourceNode.connect(procNode);
    procNode.connect(audioCtx.destination); // required for onaudioprocess to fire

    procNode.onaudioprocess = function (ev) {
      if (!listening) return;
      const input = ev.inputBuffer.getChannelData(0);
      pcmChunks.push(new Float32Array(input)); // copy the samples

      // Silence detection for auto-stop.
      analyser.getByteTimeDomainData(silData);
      let sum = 0;
      for (let i = 0; i < silData.length; i++) { const x = (silData[i] - 128) / 128; sum += x * x; }
      const rms = Math.sqrt(sum / silData.length);
      const elapsed = Date.now() - recordStartAt;

      if (rms > 0.015) {
        speechStarted = true;
        clearTimeout(silenceTimer); silenceTimer = null;
      } else if (speechStarted && elapsed > 1200 && !silenceTimer) {
        silenceTimer = setTimeout(function () { if (listening) stopListening(); }, 1500);
      }
    };
  } catch (e) {
    console.error("Audio capture setup failed:", e);
    showError("Could not start recording: " + (e && e.message ? e.message : e));
    listening = false; setMicListening(false);
    cleanupMic();
    return;
  }

  // Hard stop after 15s.
  maxTimer = setTimeout(function () { if (listening) stopListening(); }, 15000);
}

function stopListening() {
  if (!listening) return;
  listening = false;
  clearTimeout(silenceTimer); clearTimeout(maxTimer);
  setMicListening(false);
  setStatus("Processing…", "thinking");

  // Flatten PCM, encode WAV, then send.
  const sampleRate = recSampleRate || 16000;
  cleanupMic();

  let total = 0;
  for (let i = 0; i < pcmChunks.length; i++) total += pcmChunks[i].length;
  console.log("Captured PCM samples:", total, "@", sampleRate, "Hz");
  if (total < sampleRate * 0.3) { // < 0.3s of audio
    showError("Too little audio captured. Speak a bit longer.");
    readyForNextTurn("Tap the mic and speak again");
    return;
  }

  const merged = new Float32Array(total);
  let off = 0;
  for (let i = 0; i < pcmChunks.length; i++) { merged.set(pcmChunks[i], off); off += pcmChunks[i].length; }
  pcmChunks = [];

  const wavBlob = encodeWav(merged, sampleRate);
  transcribeAndSend(wavBlob, "audio/wav");
}

function cleanupMic() {
  clearTimeout(silenceTimer); clearTimeout(maxTimer);
  try { if (procNode) { procNode.disconnect(); procNode.onaudioprocess = null; } } catch (e) {}
  try { if (sourceNode) sourceNode.disconnect(); } catch (e) {}
  try { if (analyser) analyser.disconnect(); } catch (e) {}
  procNode = null; sourceNode = null; analyser = null;
  if (micStream) { micStream.getTracks().forEach(function (t) { t.stop(); }); micStream = null; }
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
}

// Encode Float32 PCM -> 16-bit mono WAV Blob (what Sarvam accepts).
function encodeWav(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  function wr(off, s) { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); }

  wr(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  wr(8, "WAVE");
  wr(12, "fmt ");
  view.setUint32(16, 16, true);        // PCM chunk size
  view.setUint16(20, 1, true);         // PCM format
  view.setUint16(22, 1, true);         // mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true); // byte rate
  view.setUint16(32, 2, true);         // block align
  view.setUint16(34, 16, true);        // bits per sample
  wr(36, "data");
  view.setUint32(40, samples.length * 2, true);

  let off = 44;
  for (let i = 0; i < samples.length; i++, off += 2) {
    let s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([view], { type: "audio/wav" });
}

function blobToBase64(blob) {
  return new Promise(function (resolve, reject) {
    const r = new FileReader();
    r.onloadend = function () {
      const s = String(r.result || "");
      const c = s.indexOf(",");
      resolve(c >= 0 ? s.substring(c + 1) : s);
    };
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

async function transcribeAndSend(blob, mimeType) {
  busy = true; setMicEnabled(false);
  setStatus("Transcribing…", "thinking");
  setHeard("Transcribing your speech…");
  let base64;
  try { base64 = await blobToBase64(blob); }
  catch (e) { showError("Could not read audio."); readyForNextTurn("Tap the mic to retry"); return; }

  // Audio is large -> POST (JSONP GET can't carry it). Using text/plain avoids
  // a CORS preflight; Apps Script /exec accepts simple cross-origin POSTs.
  // 'redirect: follow' is important: Apps Script 302-redirects to
  // script.googleusercontent.com to serve the response.
  // Abort if the request hangs (so we never sit on "Transcribing…" forever).
  const ctrl = new AbortController();
  const to = setTimeout(function () { ctrl.abort(); }, 25000);

  try {
    console.log("Sending STT POST, audio base64 length:", base64.length);
    const resp = await fetch(APPS_SCRIPT_URL + "?api=voice&action=STT", {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      redirect: "follow",
      signal: ctrl.signal,
      body: JSON.stringify({ audio: base64, mimeType: mimeType, lang: sttLang() })
    });
    clearTimeout(to);
    console.log("STT HTTP status:", resp.status);
    const raw = await resp.text();
    console.log("STT raw response:", raw.substring(0, 300));
    let data = {};
    try { data = JSON.parse(raw); } catch (pe) {
      showError("STT returned non-JSON (deploy as NEW version, access = Anyone).");
      readyForNextTurn("Tap the mic to retry");
      return;
    }
    if (data.error) { console.warn("STT error:", data.error); showError("STT: " + data.error); }
    const transcript = (data && data.transcript ? String(data.transcript) : "").trim();
    if (!transcript) {
      readyForNextTurn("Didn't catch that — tap the mic and try again");
      return;
    }
    showError("");
    sendText(transcript);   // feed into onboarding/order flow
  } catch (e) {
    clearTimeout(to);
    console.error("STT request failed:", e && e.name, e && e.message);
    if (e && e.name === "AbortError") {
      showError("STT timed out. The POST to Apps Script did not return.");
    } else {
      showError("Could not reach STT (CORS/network). Web app must be deployed as 'Anyone'. " + (e && e.message ? e.message : ""));
    }
    readyForNextTurn("Tap the mic to try again");
  }
}

/* =====================================================
   MIC BUTTON
===================================================== */
function onMicTap() {
  unlockAudio();
  if (!started) { started = true; startSession(); return; }
  if (busy) return;                       // ignore taps while thinking/speaking
  if (listening) { stopListening(); }     // tap again = stop & send
  else { startListening(); }              // tap = start talking
}

/* =====================================================
   NEW ORDER
===================================================== */
function startNewOrder() {
  unlockAudio();
  stopListening(); cleanupMic();
  sessionId = ""; currentLanguage = "en-IN"; onboardStep = "ASK_LANGUAGE";
  setHeard("Waiting..."); setAssistant("Starting a new order...");
  $("cart").innerHTML = '<div class="empty">Your cart is empty.</div>';
  $("total").textContent = "₹0";
  started = true;
  startSession();
}

/* =====================================================
   INIT
===================================================== */
window.addEventListener("load", function () {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    setStatus("Recording not supported — use a modern browser", "error");
    setMicEnabled(false);
    return;
  }
  setStatus("Tap the mic to start", "");
});
</script>
</body>
</html>
