<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roots & Ruchi - Voice Ordering</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f7f4ef; color: #2d241e; }
.header { background: #5b2c1f; color: white; padding: 22px 18px; text-align: center; }
.header h1 { margin: 0; font-size: 28px; }
.header p { margin: 7px 0 0; opacity: 0.9; }
.container { max-width: 720px; margin: 25px auto; padding: 0 15px; }
.card { background: white; border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
.status { text-align: center; font-size: 16px; margin-bottom: 18px; font-weight: bold; }
.status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #888; margin-right: 7px; }
.status-listening .status-dot { background: #2e9d50; }
.status-speaking .status-dot { background: #d99000; }
.status-thinking .status-dot { background: #2d7dd2; }
.status-error .status-dot { background: #d33; }
.mic-area { text-align: center; padding: 10px 0 20px; }
#micButton { width: 120px; height: 120px; border-radius: 50%; border: none; background: #5b2c1f; color: white; font-size: 46px; cursor: pointer; box-shadow: 0 7px 20px rgba(91,44,31,0.3); transition: background .2s; }
#micButton.listening { background: #2e9d50; animation: pulse 1.3s infinite; }
#micButton:disabled { opacity: .55; cursor: not-allowed; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
.mic-label { margin-top: 12px; font-size: 16px; color: #666; }
.section-title { font-weight: bold; font-size: 18px; margin-bottom: 10px; }
.heard { min-height: 45px; background: #f2eee9; padding: 14px; border-radius: 10px; line-height: 1.5; }
.assistant { min-height: 45px; background: #fff4df; padding: 14px; border-radius: 10px; line-height: 1.5; }
.cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
.cart-name { font-weight: bold; }
.cart-qty { color: #777; font-size: 14px; }
.total { display: flex; justify-content: space-between; font-size: 21px; font-weight: bold; margin-top: 15px; }
.buttons { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
button.secondary { border: 1px solid #5b2c1f; background: white; color: #5b2c1f; padding: 12px 18px; border-radius: 10px; cursor: pointer; }
.hint { text-align: center; color: #777; font-size: 13px; margin-top: 12px; }
.error { color: #c62828; font-size: 14px; margin-top: 10px; }
.empty { color: #888; padding: 10px 0; }
@media(max-width:600px) { .header h1 { font-size: 23px; } .card { padding: 17px; } }
</style>
</head>
<body>
<div class="header">
  <h1>🌿 Roots & Ruchi</h1>
  <p>Voice Ordering Assistant</p>
</div>

<div class="container">
  <div class="card">
    <div id="status" class="status">
      <span class="status-dot"></span>
      <span id="statusText">Tap the mic to start</span>
    </div>
    <div class="mic-area">
      <button id="micButton" onclick="onMicTap()">🎙️</button>
      <div class="mic-label" id="micLabel">Tap to talk</div>
      <div class="hint">Tap the mic, speak, then tap again (or pause) to send.</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">🗣️ You said</div>
    <div id="heard" class="heard">Waiting...</div>
  </div>

  <div class="card">
    <div class="section-title">🤖 Roots & Ruchi</div>
    <div id="assistant" class="assistant">Tap the mic to begin.</div>
  </div>

  <div class="card">
    <div class="section-title">🛒 Your Order</div>
    <div id="cart"><div class="empty">Your cart is empty.</div></div>
    <div class="total"><span>Total</span><span id="total">₹0</span></div>
  </div>

  <div class="card">
    <div class="buttons">
      <button class="secondary" onclick="startNewOrder()">🔄 New Order</button>
      <button class="secondary" onclick="showCart()">🛒 Refresh Cart</button>
    </div>
    <div id="error" class="error"></div>
  </div>
</div>

<script>
/* =====================================================
   CONFIG
===================================================== */
const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwT0MBiq-vS2yI4QQ1TIuyOb3h6xDPFpXIJPBNAyW7vipLcZFGL2KEoKwLww_GnLUgqnw/exec";

/* =====================================================
   STATE
===================================================== */
let sessionId = "";
let currentLanguage = "en-IN";
let onboardStep = "ASK_LANGUAGE";
let started = false;
let listening = false;
let busy = false;                // true while waiting on backend / speaking
let recognition = null;
let supportsSpeech = false;
let finalTranscript = "";
let silenceTimer = null;
let sharedAudio = null;
let audioUnlocked = false;

/* =====================================================
   UI
===================================================== */
function $(id) { return document.getElementById(id); }
function setStatus(t, type) { $("statusText").textContent = t; const s = $("status"); s.className = "status"; if (type) s.classList.add("status-" + type); }
function setAssistant(t) { $("assistant").textContent = t || ""; }
function setHeard(t) { $("heard").textContent = t || ""; }
function showError(t) { $("error").textContent = t || ""; }
function setMicListening(on) {
  const b = $("micButton");
  if (on) { b.classList.add("listening"); b.textContent = "🛑"; $("micLabel").textContent = "Listening… tap to send"; }
  else { b.classList.remove("listening"); b.textContent = "🎙️"; $("micLabel").textContent = "Tap to talk"; }
}
function setMicEnabled(on) { $("micButton").disabled = !on; }

/* =====================================================
   JSONP
===================================================== */
function callBackend(action, params, cb) {
  const name = "rrcb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
  const q = new URLSearchParams();
  q.set("api", "voice"); q.set("action", action); q.set("callback", name);
  params = params || {};
  Object.keys(params).forEach(k => q.set(k, params[k] == null ? "" : params[k]));
  const script = document.createElement("script");
  let done = false;
  const t = setTimeout(function () {
    if (done) return; done = true;
    cb(new Error("Request timed out."), null);
    delete window[name]; if (script.parentNode) script.remove();
  }, 20000);
  window[name] = function (res) {
    if (done) return; done = true; clearTimeout(t);
    cb(null, res); delete window[name]; if (script.parentNode) script.remove();
  };
  script.onerror = function () {
    if (done) return; done = true; clearTimeout(t);
    cb(new Error("Unable to connect to backend."), null);
    delete window[name]; if (script.parentNode) script.remove();
  };
  script.src = APPS_SCRIPT_URL + "?" + q.toString();
  document.body.appendChild(script);
}

/* =====================================================
   AUDIO (play, then a callback; never blocks the flow)
===================================================== */
function unlockAudio() {
  if (audioUnlocked) return;
  try {
    if (!sharedAudio) sharedAudio = new Audio();
    sharedAudio.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=";
    const p = sharedAudio.play();
    if (p && p.then) p.then(() => { sharedAudio.pause(); sharedAudio.currentTime = 0; }).catch(() => {});
    audioUnlocked = true;
  } catch (e) {}
}

function stopAudio() {
  if (sharedAudio) { try { sharedAudio.pause(); sharedAudio.currentTime = 0; } catch (e) {} }
  if ("speechSynthesis" in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
}

// Speak the response, then call onDone. Guaranteed to call onDone exactly once.
function speakThen(res, onDone) {
  stopAudio();
  let done = false;
  const finish = function () { if (done) return; done = true; onDone && onDone(); };

  const text = (res && res.speak) || "";
  const useBrowser = !res || !res.needAudio || (res.language === "en-IN");

  if (useBrowser) {
    if (!text || !("speechSynthesis" in window)) { finish(); return; }
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = res && res.language ? res.language : "en-IN";
      u.onend = finish;
      u.onerror = finish;
      window.speechSynthesis.speak(u);
      setTimeout(finish, 8000); // safety
    } catch (e) { finish(); }
    return;
  }

  // Non-English: fetch audio, play it, then finish.
  setStatus("Speaking...", "speaking");
  const guard = setTimeout(finish, 8000); // hard safety
  callBackend("TTS", { lang: res.language || "en-IN", text: text }, function (err, a) {
    if (err || !a || !a.audio) { clearTimeout(guard); finish(); return; }
    try {
      if (!sharedAudio) sharedAudio = new Audio();
      sharedAudio.onended = function () { clearTimeout(guard); finish(); };
      sharedAudio.onerror = function () { clearTimeout(guard); finish(); };
      sharedAudio.src = "data:audio/wav;base64," + a.audio;
      const p = sharedAudio.play();
      if (p && p.catch) p.catch(function () { clearTimeout(guard); finish(); });
    } catch (e) { clearTimeout(guard); finish(); }
  });
}

/* =====================================================
   SESSION
===================================================== */
function startSession() {
  busy = true; setMicEnabled(false);
  setStatus("Connecting...", "thinking");
  callBackend("ONBOARD_START", {}, function (err, res) {
    if (err) { showError(err.message); setStatus("Connection failed", "error"); busy = false; setMicEnabled(true); return; }
    if (!res || res.ok === false) { showError((res && res.error) || "Unable to start."); setStatus("Error", "error"); busy = false; setMicEnabled(true); return; }
    applyResponse(res);
    speakThen(res, function () {
      busy = false;
      setStatus("Your turn — tap the mic to answer", "");
      setMicEnabled(true);
    });
  });
}

/* =====================================================
   SEND UTTERANCE
===================================================== */
function sendText(text) {
  text = String(text || "").trim();
  if (!text) { busy = false; setStatus("Your turn — tap the mic", ""); setMicEnabled(true); return; }
  setHeard(text);
  busy = true; setMicEnabled(false);
  setStatus("Thinking...", "thinking");
  callBackend("COMMAND", { sessionId: sessionId, text: text }, function (err, res) {
    if (err) { showError(err.message); setStatus("Error", "error"); busy = false; setMicEnabled(true); return; }
    if (!res || res.ok === false) {
      showError((res && res.error ? res.error + (res.detail ? " — " + res.detail : "") : "Something went wrong."));
      setStatus("Error", "error"); busy = false; setMicEnabled(true); return;
    }
    showError("");
    applyResponse(res);
    if (res.cart) renderCart(res.cart);
    speakThen(res, function () {
      busy = false;
      setStatus("Your turn — tap the mic", "");
      setMicEnabled(true);
    });
  });
}

function applyResponse(res) {
  if (res.sessionId) sessionId = res.sessionId;
  if (res.language) currentLanguage = res.language;
  if (res.onboardState) onboardStep = res.onboardState;
  if (res.speak) setAssistant(res.speak);
}

/* =====================================================
   CART
===================================================== */
function showCart() {
  if (!sessionId) return;
  callBackend("CART", { sessionId: sessionId }, function (err, res) {
    if (err || !res || res.ok === false) return;
    renderCart(res);
  });
}
function renderCart(cart) {
  const c = $("cart"); c.innerHTML = "";
  if (!cart || !cart.items || cart.items.length === 0) {
    c.innerHTML = '<div class="empty">Your cart is empty.</div>';
    $("total").textContent = "₹0"; return;
  }
  cart.items.forEach(function (it) {
    const row = document.createElement("div"); row.className = "cart-item";
    const left = document.createElement("div");
    left.innerHTML = '<div class="cart-name">' + esc(it.itemName) + '</div>' +
      '<div class="cart-qty">' + it.quantity + " × ₹" + it.unitPrice + "</div>";
    const right = document.createElement("div"); right.textContent = "₹" + it.lineTotal;
    row.appendChild(left); row.appendChild(right); c.appendChild(row);
  });
  $("total").textContent = "₹" + (cart.total || 0);
}
function esc(v) {
  return String(v || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

/* =====================================================
   SPEECH RECOGNITION (tap to talk)
===================================================== */
function sttLang() {
  // Names/numbers recognize better in English; items in the chosen language.
  if (onboardStep === "ASK_NAME" || onboardStep === "ASK_PHONE" || onboardStep === "ASK_LANGUAGE") return "en-IN";
  return currentLanguage || "en-IN";
}

function setupRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    supportsSpeech = false;
    setStatus("Speech not supported — use Chrome", "error");
    setMicEnabled(false);
    return;
  }
  supportsSpeech = true;
  recognition = new SR();
  recognition.interimResults = true;
  recognition.continuous = true;
  recognition.maxAlternatives = 1;

  recognition.onresult = function (event) {
    let interim = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const chunk = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalTranscript += chunk + " ";
      else interim += chunk;
    }
    setHeard((finalTranscript + " " + interim).trim());
    // Reset the pause timer on every result.
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(function () { stopListening(); }, 1800);
  };

  recognition.onerror = function (e) {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      showError("Microphone denied. Allow it and reload.");
      setStatus("Mic blocked", "error");
    }
    // otherwise onend handles it
  };

  recognition.onend = function () {
    listening = false;
    setMicListening(false);
    clearTimeout(silenceTimer);
    const full = String(finalTranscript || "").trim();
    finalTranscript = "";
    if (full) { sendText(full); }
    else { if (!busy) { setStatus("Your turn — tap the mic", ""); setMicEnabled(true); } }
  };
}

function startListening() {
  if (!supportsSpeech || listening || busy) return;
  finalTranscript = "";
  try { recognition.lang = sttLang(); } catch (e) {}
  try {
    recognition.start();
    listening = true;
    setMicListening(true);
    setStatus("Listening…", "listening");
  } catch (e) {
    // start() can throw if called too soon after stop; retry shortly.
    setTimeout(function () { try { recognition.start(); listening = true; setMicListening(true); setStatus("Listening…", "listening"); } catch (e2) {} }, 300);
  }
}

function stopListening() {
  if (!listening) return;
  clearTimeout(silenceTimer);
  try { recognition.stop(); } catch (e) {}   // onend will send the transcript
}

/* =====================================================
   MIC BUTTON
===================================================== */
function onMicTap() {
  unlockAudio();
  if (busy) return;

  if (!started) {
    started = true;
    startSession();          // greeting -> then user taps to answer
    return;
  }
  if (listening) { stopListening(); }
  else { startListening(); }
}

/* =====================================================
   NEW ORDER
===================================================== */
function startNewOrder() {
  unlockAudio();
  stopAudio();
  if (listening) { try { recognition.stop(); } catch (e) {} listening = false; setMicListening(false); }
  sessionId = ""; currentLanguage = "en-IN"; onboardStep = "ASK_LANGUAGE";
  setHeard(""); setAssistant("Starting a new order...");
  $("cart").innerHTML = '<div class="empty">Your cart is empty.</div>';
  $("total").textContent = "₹0";
  started = true;
  startSession();
}

/* =====================================================
   INIT
===================================================== */
window.addEventListener("load", function () {
  setupRecognition();
  setStatus("Tap the mic to start", "");
});
</script>
</body>
</html>
